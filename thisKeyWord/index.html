<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- form to add a new user -->
    <div class="form">
        <h1>Add User</h1>

        <form>
            <label for="name">Name</label>
            <input type="text" id="name">

            <label for="role">Role</label>
            <input type="text" id="role">

            <label for="bio">Bio</label>
            <textarea id="bio"></textarea>

            <label for="photo">Photo URL</label>
            <input type="text" id="photo">

            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- all user cards -->
    <div class="cards-container">

        <!-- card 1 -->
        <div class="user-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmvDgRjbl2o2d3f44dhVFhDypYZvJ9Id6Ec2JXzBtmeg&s=10" alt="Captain America">
            <h2">Captain America</h2>
            <h3>Strategy Developer</h3>
            <p>Loves building beautiful  and effective strategies.</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
